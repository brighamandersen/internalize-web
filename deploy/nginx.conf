server {
  server_name internalize.brighamandersen.com; 
  root /home/brig/dev/internalize-web;
  index index.html;

  listen 443 ssl http2; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/brighamandersen.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/brighamandersen.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = internalize.brighamandersen.com) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  server_name internalize.brighamandersen.com;
  listen 80;
  return 404; # managed by Certbot
}
