<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0, viewport-fit=cover" />
  <title>Internalize</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#232323" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav class="navbar">
    <div class="nav-item">Internalize</div>
    <button id="edit-btn" class="nav-item btn text-btn">Edit</button>
    <button id="save-btn" class="nav-item btn text-btn hidden">Save</button>
  </nav>
  <textarea id="passage-textarea" placeholder="Press EDIT to add a passage" readonly></textarea>
  <div id="filter-btn-group">
    <button id="filter-btn-full" class="btn filter-btn active">Full</button>
    <button id="filter-btn-hints" class="btn filter-btn">Hints</button>
    <button id="filter-btn-blanks" class="btn filter-btn">Blanks</button>
  </div>
  <script type="module" src="main.js"></script>
</body>

</html>
