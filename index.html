<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Internalize</title>
  <!-- Start of manifest setup -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512x512.png">
  <!-- End of manifest setup -->


  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #d0d0d0;
      --edit-border: #007bff;
      --disabled: #333333;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --text: #ffffff;
        --border: #333333;
        --edit-border: #3399ff;
        --disabled: #d0d0d0;
      }
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: monospace;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 4px;
    }

    .header-item {
      padding: 8px;
    }

    .icon-btn {
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      color: var(--text);
    }

    .screen {
      display: none;
      height: calc(100vh - 52px);
    }

    .screen.active {
      display: block;
    }

    .screen>.container {
      padding: 22px;
      max-width: 700px;
      margin: auto;
      box-sizing: border-box;
      padding-bottom: 180px;
      height: 100%;
      border: 3px solid transparent;
      border-radius: 14px;
      transition: border 0.2s ease;
    }

    #editor .container.editing {
      border-color: var(--edit-border);
    }

    #output {
      font-size: 20px;
      line-height: 1.85;
      white-space: pre-wrap;
      cursor: text;
      height: 100%;
      overflow-y: auto;
      font-family: monospace;
      letter-spacing: 0.15em;
    }

    #editor textarea {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border: none;
      outline: none;
      resize: none;
      background: var(--bg);
      color: var(--text);
      font-size: 20px;
      line-height: 1.85;
      font-family: monospace;
      overflow-y: auto;
    }

    /* ---------- BOTTOM BAR ---------- */
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg);
      border: 3px solid var(--text);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      z-index: 10;
      /* ensure same height */
      min-height: 54px;
    }

    .controls button {
      border: none;
      border-right: 3px solid var(--text);
      background: transparent;
      color: var(--text);
      padding: 14px 26px;
      font-size: 16px;
      cursor: pointer;
      flex: 1;
      font-family: monospace;
      letter-spacing: 0.15em;
    }

    .controls button:first-child {
      border-left: none;
    }

    .controls button:last-child {
      border-right: none;
    }

    .controls button.active {
      background: var(--text);
      color: var(--bg);
    }

    .controls button:hover:not(.active) {
      background: #dcdcdc;
    }

    #fullscreenBtn {
      background: none;
      border: none;
      cursor: pointer;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <div class="header-item">Internalize</div>
    <div>

    </div>
    <div id="editToggle" class="header-item icon-btn">EDIT</div>
    <!-- <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrows-fullscreen"
      viewBox="0 0 16 16">
      <path fill-rule="evenodd"
        d="M5.828 10.172a.5.5 0 0 0-.707 0l-4.096 4.096V11.5a.5.5 0 0 0-1 0v3.975a.5.5 0 0 0 .5.5H4.5a.5.5 0 0 0 0-1H1.732l4.096-4.096a.5.5 0 0 0 0-.707m4.344 0a.5.5 0 0 1 .707 0l4.096 4.096V11.5a.5.5 0 1 1 1 0v3.975a.5.5 0 0 1-.5.5H11.5a.5.5 0 0 1 0-1h2.768l-4.096-4.096a.5.5 0 0 1 0-.707m0-4.344a.5.5 0 0 0 .707 0l4.096-4.096V4.5a.5.5 0 1 0 1 0V.525a.5.5 0 0 0-.5-.5H11.5a.5.5 0 0 0 0 1h2.768l-4.096 4.096a.5.5 0 0 0 0 .707m-4.344 0a.5.5 0 0 1-.707 0L1.025 1.732V4.5a.5.5 0 0 1-1 0V.525a.5.5 0 0 1 .5-.5H4.5a.5.5 0 0 1 0 1H1.732l4.096 4.096a.5.5 0 0 1 0 .707" />
    </svg> -->
    <button id="fullscreenBtn" aria-label="Toggle fullscreen">

      <!-- ENTER fullscreen icon -->
      <svg id="enterIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M7 14H5v5h5v-2H7v-3zm0-4h2V7h3V5H5v5zm10 9h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
      </svg>

      <!-- EXIT fullscreen icon -->
      <svg id="exitIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" hidden>
        <path d="M5 16h2v3h3v2H5v-5zm12 3v-3h2v5h-5v-2h3zM7 5v3H5V3h5v2H7zm12 3h-2V5h-3V3h5v5z" />
      </svg>

    </button>
  </header>

  <div id="viewer" class="screen active">
    <div class="container">
      <div id="output"></div>
    </div>
  </div>

  <div id="editor" class="screen">
    <div class="container">
      <textarea id="input"></textarea>
    </div>
  </div>

  <div id="controls" class="controls active">
    <button onclick="setMode('full')" id="btn-full" class="active">ALL</button>
    <button onclick="setMode('first')" id="btn-first">A__</button>
    <button onclick="setMode('blank')" id="btn-blank">___</button>
  </div>

  <script>
    const viewer = document.getElementById("viewer");
    const editor = document.getElementById("editor");
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const editToggle = document.getElementById("editToggle");
    const controls = document.getElementById("controls");
    const container = editor.querySelector(".container");

    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const enterIcon = document.getElementById("enterIcon");
    const exitIcon = document.getElementById("exitIcon");

    fullscreenBtn.onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        enterIcon.hidden = false;
        exitIcon.hidden = true;
      } else {
        document.exitFullscreen();
        enterIcon.hidden = true;
        exitIcon.hidden = false;
      }
    };

    // document.addEventListener("fullscreenchange", () => {
    //   const isFs = !!document.fullscreenElement;
    //   enterIcon.hidden = isFs;
    //   exitIcon.hidden = !isFs;
    // });

    const buttonGroup = {
      full: document.getElementById("btn-full"),
      first: document.getElementById("btn-first"),
      blank: document.getElementById("btn-blank"),
    };

    let mode = "full";
    let editing = false;

    function save() {
      localStorage.setItem("internalize_passage", input.value);
    }

    function load() {
      input.value = localStorage.getItem("internalize_passage") || "";
      render();
    }

    function firstLetters(text) {
      return text.split(/\b/).map(part => {
        if (/^\w+$/.test(part)) {
          return part.length <= 1 ? part : part[0] + "_".repeat(part.length - 1);
        }
        return part;
      }).join("");
    }

    function blankLetters(text) {
      return text.replace(/[^\s]/g, "_");
    }

    function setEditing(state) {
      editing = state;

      if (editing) {
        viewer.classList.remove("active");
        editor.classList.add("active");
        container.classList.add("editing");
        editToggle.textContent = "SAVE CHANGES";
        input.focus();

        mode = "full";
        render();
      } else {
        if (!input.value) {
          alert("Cannot have empty passage.");
          return;
        }

        editor.classList.remove("active");
        viewer.classList.add("active");
        container.classList.remove("editing");
        editToggle.textContent = "EDIT";

        render();
      }
    }

    editToggle.addEventListener("click", () => {
      setEditing(!editing);
    });

    function render() {
      const passage = input.value;
      let result = passage;
      if (mode === "first") result = firstLetters(passage);
      if (mode === "blank") result = blankLetters(passage);

      output.textContent = result;

      if (!editing) {
        Object.values(buttonGroup).forEach(b => b.classList.remove("active"));
        buttonGroup[mode].classList.add("active");
      }

      save();
    }

    function setMode(newMode) {
      mode = newMode;
      render();
    }

    input.addEventListener("input", render);

    load();

    /* register service worker */
    // if ("serviceWorker" in navigator) {
    //   window.addEventListener("load", () => {
    //     navigator.serviceWorker.register("./sw.js");
    //   });
    // }
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const reg = await navigator.serviceWorker.register("/sw.js");
          console.log("✅ SW registered:", reg.scope);
        } catch (err) {
          console.error("❌ SW failed:", err);
        }
      });
    }
  </script>

</body>

</html>
