<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Internalize</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="layout">
    <header>
      <div class="header-item">Internalize</div>
      <button id="editSaveButton" class="header-item">Edit</button>
    </header>
    <hr>

    <div class="content">
      <div class="container">
        <textarea id="passageTextarea"
          placeholder="Welcome to Internalize! Press EDIT to add a passage. Then use the bar below to show/hide parts of the passage to help you memorize it!"
          readonly></textarea>
      </div>
    </div>

    <div id="filterButtonGroupContainer" class="visible">
      <div id="filterButtonGroup">
        <button id="filterButtonFull" class="filter-button active">Full</button>
        <button id="filterButtonHints" class="filter-button">Hints</button>
        <button id="filterButtonBlanks" class="filter-button">Blanks</button>
      </div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>

</html>
