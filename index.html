<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Internalize</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512x512.png">


  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #d0d0d0;
      --disabled: #333333;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --text: #ffffff;
        --border: #333333;
        --disabled: #d0d0d0;
      }
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: monospace;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 4px;
    }

    .header-item {
      padding: 8px;
    }

    .text-btn {
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      color: var(--text);
    }

    .screen {
      display: none;
      height: calc(100vh - 52px);
    }

    .screen.active {
      display: block;
    }

    .screen>.container {
      padding: 22px;
      max-width: 700px;
      margin: auto;
      box-sizing: border-box;
      padding-bottom: 180px;
      height: 100%;
      border: 3px solid transparent;
      border-radius: 14px;
      transition: border 0.2s ease;
    }

    #editor .container {
      border-color: var(--text);
    }

    #output {
      font-size: 20px;
      line-height: 1.85;
      white-space: pre-wrap;
      cursor: text;
      height: 100%;
      overflow-y: auto;
      font-family: monospace;
      letter-spacing: 0.15em;
    }

    #editor textarea {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border: none;
      outline: none;
      resize: none;
      background: var(--bg);
      color: var(--text);
      font-size: 20px;
      line-height: 1.85;
      font-family: monospace;
      letter-spacing: 0.15em;
      overflow-y: auto;
    }

    /* ---------- BOTTOM BAR ---------- */
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg);
      border: 3px solid var(--text);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      z-index: 10;
      /* ensure same height */
      min-height: 54px;
    }

    .controls button {
      border: none;
      border-right: 3px solid var(--text);
      background: transparent;
      color: var(--text);
      padding: 14px 26px;
      font-size: 16px;
      cursor: pointer;
      flex: 1;
      font-family: monospace;
      letter-spacing: 0.15em;
    }

    .controls button:last-child {
      border-right: none;
    }

    .controls button.active {
      background: var(--text);
      color: var(--bg);
    }
  </style>
</head>

<body>

  <header>
    <div class="header-item">Internalize</div>
    <div id="editToggle" class="header-item text-btn">EDIT</div>
  </header>

  <div id="viewer" class="screen active">
    <div class="container">
      <div id="output"></div>
    </div>
  </div>

  <div id="editor" class="screen">
    <div class="container">
      <textarea id="input"></textarea>
    </div>
  </div>

  <div id="controls" class="controls">
    <button onclick="handleViewModeButtonClick('full')" id="view-mode-btn-full" class="active">Full</button>
    <button onclick="handleViewModeButtonClick('hints')" id="view-mode-btn-hints">Hints</button>
    <button onclick="handleViewModeButtonClick('blanks')" id="view-mode-btn-blanks">Blanks</button>
  </div>

  <script>
    const viewer = document.getElementById("viewer");
    const editor = document.getElementById("editor");
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const editToggle = document.getElementById("editToggle");
    const controls = document.getElementById("controls");
    const container = editor.querySelector(".container");

    const buttonGroup = {
      full: document.getElementById("view-mode-btn-full"),
      hints: document.getElementById("view-mode-btn-hints"),
      blanks: document.getElementById("view-mode-btn-blanks"),
    };

    let viewMode = "full";
    let isEditing = false;

    /* ---------- PERSISTENT STORAGE ---------- */

    function savePassageInLocalStorage() {
      localStorage.setItem("internalize_passage", input.value);
    }

    function loadPassageFromLocalStorage() {
      input.value = localStorage.getItem("internalize_passage") || "Welcome! Press EDIT to begin adding a passage to internalize.";
      render();
    }

    /* ---------- FULLSCREEN DOUBLE TAP ---------- */

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // Desktop
    document.addEventListener("dblclick", toggleFullscreen);

    // Mobile
    let lastTouchTime = 0;
    document.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTouchTime < 300) {
        // Double-tap detected
        toggleFullscreen();
        lastTouchTime = 0; // Reset
      } else {
        lastTouchTime = now;
      }
    });

    /* ---------- FULLSCREEN DOUBLE TAP ---------- */

    /* END – Double tap to enter/exit fullscreen */

    function getPassageHintsMask(passage) {
      return passage.split(/\b/).map(part => {
        if (/^\w+$/.test(part)) {
          return part.length <= 1 ? part : part[0] + "_".repeat(part.length - 1);
        }
        return part;
      }).join("");
    }

    function getPassageBlanksMask(passage) {
      return passage.replace(/[^\s]/g, "_");
    }

    function setEditing(state) {
      isEditing = state;

      if (isEditing) {
        viewer.classList.remove("active");
        editor.classList.add("active");
        editToggle.textContent = "SAVE CHANGES";
        input.focus();

        viewMode = "full";
        render();
      } else {
        if (!input.value) {
          alert("Cannot have empty passage.");
          return;
        }

        editor.classList.remove("active");
        viewer.classList.add("active");
        editToggle.textContent = "EDIT";

        render();
      }
    }

    function handleEditPassageClick() {
      viewer.classList.remove("active");
      editor.classList.add("active");
      editToggle.textContent = "SAVE CHANGES";

      viewMode = "full";
      render();

      input.focus();
    }

    function handleSavePassageClick() {
      if (!input.value) {
        alert("Cannot have empty passage.");
        return;
      }

      editor.classList.remove("active");
      viewer.classList.add("active");
      editToggle.textContent = "EDIT";

      render();
    }

    editToggle.addEventListener("click", () => {
      isEditing = !isEditing;

      if (isEditing) {
        handleEditPassageClick();
      } else {
        handleSavePassageClick();
      }
    });

    function render() {
      const passage = input.value;
      let result = passage;
      if (viewMode === "hints") result = getPassageHintsMask(passage);
      if (viewMode === "blanks") result = getPassageBlanksMask(passage);

      output.textContent = result;

      if (!isEditing) {
        Object.values(buttonGroup).forEach(b => b.classList.remove("active"));
        buttonGroup[viewMode].classList.add("active");
      }

      savePassageInLocalStorage();
    }

    function handleViewModeButtonClick(newMode) {
      viewMode = newMode;
      render();
    }

    input.addEventListener("input", render);

    loadPassageFromLocalStorage();
  </script>

</body>

</html>
